<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    <!-- Neon Border & Glyph Gradient -->
    <linearGradient id="ludeloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#6C5CE7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="80" y="80" width="864" height="864" rx="140" fill="#6C5CE7" opacity="0.4" filter="url(#glow)" />

  <!-- Main Card Body -->
  <rect x="92" y="92" width="840" height="840" rx="130" fill="url(#bgGrad)" stroke="url(#ludeloGrad)" stroke-width="14" />

  <!-- Stylized Geometric "L" -->
  <path d="M 320 280 
           L 405 245 
           L 405 670 
           L 735 670 
           L 735 755 
           L 285 755 
           L 285 320 Z" 
        fill="url(#ludeloGrad)" />

  <!-- Nested Play Triangle -->
  <polygon points="450,340 750,500 450,660" fill="url(#ludeloGrad)" opacity="0.95" />
</svg>
